<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="moonbase logo: a moon built from square blocks on a stepped base">
  <!-- 砌月：a moon assembled from square blocks (the library is all about
       blocks — block allocators, fixed-capacity containers), resting on a
       stepped base = a moon base. Two darker cells are craters. -->
  <!-- moon, block by block (pixel circle, rows 3/5/7/7/7/5/3) -->
  <g fill="#F5C044">
    <rect x="36" y="10" width="8" height="8" rx="1.5"/>
    <rect x="44" y="10" width="8" height="8" rx="1.5"/>
    <rect x="52" y="10" width="8" height="8" rx="1.5"/>
    <rect x="28" y="18" width="8" height="8" rx="1.5"/>
    <rect x="36" y="18" width="8" height="8" rx="1.5"/>
    <rect x="44" y="18" width="8" height="8" rx="1.5"/>
    <rect x="52" y="18" width="8" height="8" rx="1.5"/>
    <rect x="60" y="18" width="8" height="8" rx="1.5"/>
    <rect x="20" y="26" width="8" height="8" rx="1.5"/>
    <rect x="28" y="26" width="8" height="8" rx="1.5"/>
    <rect x="36" y="26" width="8" height="8" rx="1.5"/>
    <rect x="44" y="26" width="8" height="8" rx="1.5"/>
    <rect x="52" y="26" width="8" height="8" rx="1.5"/>
    <rect x="60" y="26" width="8" height="8" rx="1.5"/>
    <rect x="68" y="26" width="8" height="8" rx="1.5"/>
    <rect x="20" y="34" width="8" height="8" rx="1.5"/>
    <rect x="28" y="34" width="8" height="8" rx="1.5"/>
    <rect x="36" y="34" width="8" height="8" rx="1.5"/>
    <rect x="52" y="34" width="8" height="8" rx="1.5"/>
    <rect x="60" y="34" width="8" height="8" rx="1.5"/>
    <rect x="68" y="34" width="8" height="8" rx="1.5"/>
    <rect x="20" y="42" width="8" height="8" rx="1.5"/>
    <rect x="28" y="42" width="8" height="8" rx="1.5"/>
    <rect x="36" y="42" width="8" height="8" rx="1.5"/>
    <rect x="44" y="42" width="8" height="8" rx="1.5"/>
    <rect x="60" y="42" width="8" height="8" rx="1.5"/>
    <rect x="68" y="42" width="8" height="8" rx="1.5"/>
    <rect x="28" y="50" width="8" height="8" rx="1.5"/>
    <rect x="36" y="50" width="8" height="8" rx="1.5"/>
    <rect x="44" y="50" width="8" height="8" rx="1.5"/>
    <rect x="52" y="50" width="8" height="8" rx="1.5"/>
    <rect x="60" y="50" width="8" height="8" rx="1.5"/>
    <rect x="36" y="58" width="8" height="8" rx="1.5"/>
    <rect x="44" y="58" width="8" height="8" rx="1.5"/>
    <rect x="52" y="58" width="8" height="8" rx="1.5"/>
  </g>
  <!-- craters -->
  <g fill="#E19B2B">
    <rect x="44" y="34" width="8" height="8" rx="1.5"/>
    <rect x="52" y="42" width="8" height="8" rx="1.5"/>
  </g>
  <!-- stepped base: the moon base -->
  <g fill="#2B3A67">
    <rect x="8"  y="76" width="28" height="12" rx="1.5"/>
    <rect x="60" y="76" width="28" height="12" rx="1.5"/>
  </g>
  <rect x="36" y="68" width="24" height="14" rx="1.5" fill="#35477E"/>
  <!-- lit window on the base -->
  <rect x="46" y="73" width="4" height="4" rx="0.8" fill="#F5C044"/>
</svg>
